<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课程播放助手</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; color: #202124; background: #fff; font: 14px/1.6 system-ui, sans-serif; }
      .panel { padding: 20px; }
      h1 { margin: 0; font-size: 18px; }
      .platformName { margin: 4px 0 16px; color: #536174; font-size: 12px; }
      .statusText { min-height: 64px; margin: 0 0 16px; padding: 12px; border: 1px solid #e0e6ee; border-radius: 8px; background: #f7f9fc; color: #374151; overflow-wrap: anywhere; }
      .controls { display: flex; gap: 8px; }
      button { min-height: 40px; padding: 6px 12px; border: 1px solid #b9c4d4; border-radius: 7px; background: #fff; color: #202124; font: inherit; cursor: pointer; }
      .controls button { flex: 1; }
      .startButton { border-color: #2459c2; background: #2459c2; color: #fff; }
      button:disabled { opacity: 0.45; cursor: default; }
      .retryButton { width: 100%; margin-top: 8px; }
      [hidden] { display: none !important; }
      .autoNextOption { display: flex; align-items: center; gap: 8px; min-height: 40px; margin-top: 12px; cursor: pointer; }
      .autoNextOption input { width: 17px; height: 17px; margin: 0; accent-color: #2459c2; }
      .optionHelp { margin: 0 0 16px 25px; color: #536174; font-size: 12px; }
      details { border-top: 1px solid #e0e6ee; padding-top: 12px; color: #536174; font-size: 12px; }
      summary { width: fit-content; cursor: pointer; }
      ol { margin: 8px 0; padding-left: 20px; }
      details p { margin: 8px 0 0; }
      .speed { display:flex; align-items:center; justify-content:space-between; margin:12px 0; }
      select { padding:6px 10px; min-height:38px; border:1px solid #b9c4d4; border-radius:7px; background:#fff; color:#202124; font:inherit; }
      .ai { border-top:1px solid #e0e6ee; padding:14px 0; } .ai .controls { margin-top:8px; }
      .ai p { margin:8px 0 0; color:#536174; font-size:12px; overflow-wrap:anywhere; }
      .settingsButton { width:100%; margin-top:10px; }
      :focus-visible { outline: 2px solid #2459c2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="panel" aria-busy="false">
      <h1>课程播放助手</h1>
      <p class="platformName" id="platformName">自动识别学习通 / 雨课堂</p>
      <p class="statusText" id="statusText" role="status" aria-live="polite">正在读取当前课程…</p>
      <div class="controls">
        <button class="startButton" id="startButton" type="button" disabled>开始 / 继续</button>
        <button id="pauseButton" type="button" disabled>暂停</button>
      </div>
      <button class="retryButton" id="retryButton" type="button" hidden>重新连接</button>
      <label class="speed">播放倍速<select id="playbackRateSelect" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></label>
      <label class="autoNextOption">
        <input id="autoNextCheckbox" type="checkbox" aria-describedby="autoNextHelp" disabled />
        播完自动下一节
      </label>
      <p class="optionHelp" id="autoNextHelp">仅切换已识别的视频目录；遇到其他任务会停止。</p>
      <section class="ai" aria-label="AI 做题">
        <div class="controls"><button class="startButton" id="quizButton" type="button">AI 做本页题</button><button id="cancelQuizButton" type="button" hidden>停止</button></div>
        <p id="quizStatusText" role="status" aria-live="polite">题目发送到你的 API，按设置自动填写、提交。</p>
        <button class="settingsButton" id="settingsButton" type="button">API 设置</button>
      </section>
      <details>
        <summary>使用帮助</summary>
        <ol>
          <li>登录平台，打开一个视频章节。</li>
          <li>在页面右下角直接操作，或在此选择倍速、开始播放。</li>
          <li>可在此处或网页播放器中暂停。</li>
        </ol>
        <p>首次安装或更新后，请刷新课程网页。若浏览器阻止播放，先在网页播放器中点一次播放。</p>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
